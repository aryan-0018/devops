apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-ops
  labels:
    app: sentinel-ops
    student: "1MS24CI026"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinel-ops
  template:
    metadata:
      labels:
        app: sentinel-ops
        student: "1MS24CI026"
    spec:
      containers:
        - name: sentinel-ops
          image: sentinel-ops:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: sentinel-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
